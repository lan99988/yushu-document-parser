services:
  mineru-api:
    image: ${MINERU_IMAGE:-document-parser-mineru:4.0.7}
    build:
      context: ..
      dockerfile: cloud/Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    ports:
      # Bind the host port only to its Tailscale address. Do not change this to
      # 0.0.0.0 or a public interface.
      - "${TAILSCALE_IP:?Set the server Tailscale IPv4 address}:8000:8000"
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_TIER: ${MINERU_TIER:-standard}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
    volumes:
      - mineru-model-cache:/root/.mineru
      - mineru-output:/app/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; key=os.getenv('MINERU_API_KEY'); headers={'Authorization':'Bearer '+key} if key else {}; request=urllib.request.Request('http://127.0.0.1:8000/v1/health', headers=headers); urllib.request.urlopen(request, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

volumes:
  mineru-model-cache:
  mineru-output:
